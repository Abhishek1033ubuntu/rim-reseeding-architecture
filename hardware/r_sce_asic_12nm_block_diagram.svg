<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 8; }
      .core { fill: #1f2937; stroke: #3b82f6; stroke-width: 2; rx: 6; }
      .sec { fill: #2d151e; stroke: #ef4444; stroke-width: 2; rx: 6; }
      .txt { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .sub { fill: #8b949e; font-size: 11px; font-weight: 400; text-anchor: middle; }
      .line { stroke: #58a6ff; stroke-width: 2; marker-end: url(#arrow); }
      .sec-line { stroke: #f87171; stroke-width: 2; stroke-dasharray: 4; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Title -->
  <text x="450" y="35" class="txt" font-size="18" fill="#58a6ff">RIM 12nm R-SCE Companion ASIC Microarchitecture</text>
  <text x="450" y="55" class="sub">Hardware Wire-Speed Compression & AES-256-GCM Secure Enclave</text>

  <!-- Main ASIC Outer Box -->
  <rect x="40" y="80" width="820" height="380" class="box" />

  <!-- Sub-Blocks -->
  <!-- DMA Engine -->
  <rect x="70" y="120" width="220" height="130" class="core" />
  <text x="180" y="175" class="txt">Coherent DMA Engine</text>
  <text x="180" y="195" class="sub">256 Descriptor Ring Buffer</text>

  <!-- Compression Pipeline -->
  <rect x="340" y="120" width="220" height="130" class="core" />
  <text x="450" y="175" class="txt">Decompression Pipeline</text>
  <text x="450" y="195" class="sub">LZ4/Huffman Hardened Logic (≥ 2.5 GB/s)</text>

  <!-- Crypto Accelerator -->
  <rect x="610" y="120" width="220" height="130" class="core" />
  <text x="720" y="175" class="txt">AES-256-GCM Engine</text>
  <text x="720" y="195" class="sub">Zero-Latency Bus Decrypt</text>

  <!-- Secure Enclave -->
  <rect x="200" y="300" width="500" height="120" class="sec" />
  <text x="450" y="350" class="txt" fill="#f87171">Hardware Secure Enclave & PCV Key Vault</text>
  <text x="450" y="375" class="sub">HMAC-SHA256 Root of Trust | Dynamic Persona Configuration Vector Ingestion</text>

  <!-- Interconnect Lines -->
  <line x1="290" y1="185" x2="340" y2="185" class="line" />
  <line x1="560" y1="185" x2="610" y2="185" class="line" />
  <line x1="450" y1="300" x2="450" y2="250" class="sec-line" />
</svg>